name: README build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "cache/**"
      - "dark-mode.svg"
      - "light-mode.svg"
  schedule:
    - cron: "0 4 * * *" # Runs at 04:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/cache/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r .github/cache/requirements.txt

      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: python today.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -- dark-mode.svg light-mode.svg cache/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: auto-update GitHub profile SVGs"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 2))
            fi
          done

          echo "Failed to push after 3 attempts" >&2
          exit 1
